name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-docs.txt
      - name: Build the book
        run: make html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-html
          path: _build/html
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check publication configuration
        id: deployment
        env:
          SITE_DEPLOY_KEY: ${{ secrets.MLC_SITE_DEPLOY_KEY }}
        run: |
          if [ -n "$SITE_DEPLOY_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Automatic publication requires MLC_SITE_DEPLOY_KEY. The book-html artifact is available for manual publication.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.deployment.outputs.enabled == 'true'
        with:
          repository: mlc-ai/mlc-ai.github.io
          ref: main
          ssh-key: ${{ secrets.MLC_SITE_DEPLOY_KEY }}
          path: site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.deployment.outputs.enabled == 'true'
        with:
          name: book-html
          path: book-html
      - name: Publish the book under /agentic-gpu-programming-for-mlsys/
        if: steps.deployment.outputs.enabled == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p site/agentic-gpu-programming-for-mlsys
          rsync -a --delete book-html/ site/agentic-gpu-programming-for-mlsys/
          touch site/.nojekyll
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add agentic-gpu-programming-for-mlsys .nojekyll
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Publish book from $SOURCE_SHA"
            git -C site push origin HEAD:main
          fi
